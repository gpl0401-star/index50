<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&family=Cinzel:wght@400;600&display=swap');

  .home {
    margin: 0 calc(-1 * var(--gutter, 1.5rem));
    background: #0a0f1e;
    color: #e8d5a3;
    font-family: 'Noto Serif SC', serif;
    position: relative;
    overflow: hidden;
  }

  /* 星空背景 */
  .home::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 15%, rgba(232,213,163,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 30%, rgba(232,213,163,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 40% 60%, rgba(232,213,163,0.25) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 70%, rgba(232,213,163,0.35) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 80%, rgba(232,213,163,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 90%, rgba(232,213,163,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 30% 45%, rgba(232,213,163,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 10%, rgba(232,213,163,0.35) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* 上方金色渐变光晕 */
  .home::after {
    content: '';
    position: absolute;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 60%;
    background: radial-gradient(ellipse, rgba(180,130,40,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  * { position: relative; z-index: 1; box-sizing: border-box; }

  /* ── 顶部细框 ── */
  .top-bar {
    border-bottom: 1px solid rgba(232,213,163,0.2);
    padding: 1rem var(--gutter, 1.5rem);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .top-wordmark {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: rgba(232,213,163,0.5);
    text-transform: uppercase;
  }
  .top-contact {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    color: rgba(232,213,163,0.5);
    text-decoration: none;
    border: 1px solid rgba(232,213,163,0.25);
    padding: 3px 10px;
    transition: border-color .2s, color .2s;
  }
  .top-contact:hover { border-color: #c8a04a; color: #c8a04a; }

  /* ── 金框 ── */
  .gold-frame {
    margin: 2rem var(--gutter, 1.5rem);
    border: 1px solid rgba(232,213,163,0.25);
    padding: 3rem 2rem 2.5rem;
    text-align: center;
    position: relative;
  }
  .gold-frame::before, .gold-frame::after {
    content: '◆';
    position: absolute;
    color: #c8a04a;
    font-size: 0.6rem;
    top: -0.5em;
  }
  .gold-frame::before { left: 1.5rem; }
  .gold-frame::after { right: 1.5rem; }

  .frame-kicker {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: rgba(232,213,163,0.5);
    display: block;
    margin-bottom: 1.5rem;
  }
  .frame-kicker span { margin: 0 0.8rem; color: #c8a04a; }

  .frame-num {
    font-family: 'Cinzel', serif;
    font-size: clamp(5rem, 18vw, 9rem);
    font-weight: 600;
    background: linear-gradient(160deg, #f0d060 0%, #c8862a 50%, #e8b84a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 0.9;
    display: block;
    margin-bottom: 0.3rem;
  }
  .frame-subtitle {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(1.2rem, 4vw, 1.8rem);
    font-weight: 300;
    color: #e8d5a3;
    letter-spacing: 0.3em;
    display: block;
    margin-bottom: 2rem;
  }
  .frame-dots { color: #c8a04a; letter-spacing: 0.5rem; font-size: 0.5rem; display: block; margin-bottom: 2rem; }

  .frame-desc {
    font-size: 0.85rem;
    font-weight: 300;
    color: rgba(232,213,163,0.6);
    line-height: 2;
    max-width: 420px;
    margin: 0 auto;
  }

  /* ── 专题 ── */
  .zhuanti-wrap {
    padding: 0 var(--gutter, 1.5rem) 3rem;
  }
  .z-head {
    border-top: 1px solid rgba(232,213,163,0.15);
    border-bottom: 1px solid rgba(232,213,163,0.15);
    padding: 0.9rem 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
  }
  .z-label {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    color: #c8a04a;
    text-transform: uppercase;
  }
  .z-count { font-family: 'Cinzel', serif; font-size: 0.55rem; color: rgba(232,213,163,0.35); letter-spacing: 0.15em; }

  .z-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: rgba(232,213,163,0.1);
    border: 1px solid rgba(232,213,163,0.1);
  }
  .z-card {
    background: #0a0f1e;
    padding: 1.8rem 1.5rem;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    transition: background .2s;
    min-height: 160px;
  }
  .z-card:hover { background: rgba(200,160,74,0.07); }
  .z-card:hover .z-name { color: #f0d060; }
  .z-card.off { opacity: 0.35; pointer-events: none; }

  .z-num { font-family: 'Cinzel', serif; font-size: 0.55rem; color: rgba(232,213,163,0.3); letter-spacing: 0.15em; }
  .z-name {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.05rem;
    font-weight: 400;
    color: #e8d5a3;
    transition: color .2s;
    flex: 1;
  }
  .z-desc { font-size: 0.75rem; font-weight: 300; color: rgba(232,213,163,0.45); line-height: 1.8; }
  .z-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 0.5rem; border-top: 1px solid rgba(232,213,163,0.08); }
  .z-tag { font-family: 'Cinzel', serif; font-size: 0.5rem; letter-spacing: 0.15em; color: #c8a04a; }
  .z-arrow { font-size: 0.7rem; color: rgba(232,213,163,0.3); }
  .z-card:hover .z-arrow { color: #c8a04a; }

  /* ── footer ── */
  .home-footer {
    border-top: 1px solid rgba(232,213,163,0.15);
    padding: 1.5rem var(--gutter, 1.5rem) 2.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }
  .f-note { font-size: 0.72rem; font-weight: 300; color: rgba(232,213,163,0.35); line-height: 1.7; }
  .f-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; flex-shrink: 0; }
  .f-fb { font-family: 'Cinzel', serif; font-size: 0.55rem; color: rgba(232,213,163,0.35); text-decoration: none; letter-spacing: 0.15em; display: flex; align-items: center; gap: 0.4rem; transition: color .15s; }
  .f-fb:hover { color: #c8a04a; }
  .f-fb svg { width: 11px; height: 11px; fill: currentColor; }
  .f-mark { font-family: 'Cinzel', serif; font-size: 0.52rem; color: rgba(232,213,163,0.25); letter-spacing: 0.15em; }

  @media (max-width: 560px) {
    .z-grid { grid-template-columns: 1fr; }
    .gold-frame { margin: 1.5rem var(--gutter, 1.5rem); padding: 2rem 1.2rem; }
    .home-footer { flex-direction: column; align-items: flex-start; }
  }
</style>
